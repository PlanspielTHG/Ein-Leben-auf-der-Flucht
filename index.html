<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ein Leben auf der Flucht</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #12100e;
  --cream: #f2ead8;
  --gold: #c49a3c;
  --rust: #8b3a1e;
  --parchment: #e8dfc8;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Crimson Pro', Georgia, serif;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#game-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
}
#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* ── HUD ── */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .5rem 1rem;
  background: linear-gradient(to bottom, rgba(8,6,4,.96) 65%, transparent);
  z-index: 20;
}
#hud-title {
  font-family: 'Playfair Display', serif;
  font-size: .9rem;
  color: var(--gold);
  font-style: italic;
  white-space: nowrap;
}
#hud-chapter {
  font-size: .6rem;
  letter-spacing: .15em;
  color: #9a8a6a;
  text-transform: uppercase;
  flex: 1;
  text-align: center;
}

/* ── TIMER ── */
#timer-wrap {
  display: flex;
  align-items: center;
  gap: .4rem;
  background: rgba(8,6,4,.85);
  border: 2px solid var(--gold);
  border-radius: 4px;
  padding: .3rem .65rem;
}
#timer-icon { font-size: .95rem; line-height: 1; }
#timer-bar-bg {
  width: 80px;
  height: 11px;
  background: #1a1206;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #3a2a10;
}
#timer-bar {
  height: 100%;
  width: 100%;
  border-radius: 6px;
  background: var(--gold);
  transition: background .3s;
}
#timer-bar.warn { background: #e07020; }
#timer-bar.danger { background: #c02010; box-shadow: 0 0 7px #c02010; }
#timer-text {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  text-align: right;
  font-family: 'Playfair Display', serif;
}

/* ── OVERLAYS ── */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s;
  padding: 1.4rem;
}
.overlay.open { opacity: 1; pointer-events: all; }

#gameover-overlay { background: rgba(0,0,0,.92); flex-direction: column; text-align: center; }
#gameover-overlay h2 { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: #c02010; margin-bottom: .65rem; }
#gameover-overlay p { color: #c8b89a; font-size: .9rem; max-width: 410px; line-height: 1.7; margin-bottom: 1.3rem; }
#btn-retry {
  padding: .6rem 1.7rem;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Crimson Pro', serif;
  font-size: .85rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: all;
}

/* ── TITLE / END ── */
#title-screen {
  position: absolute;
  inset: 0;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  z-index: 50;
}
#title-screen h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5.5vw, 4rem);
  color: var(--cream);
  margin-bottom: .25rem;
}
.title-sub {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1rem;
  color: var(--gold);
  margin-bottom: 1.5rem;
}
#title-screen p {
  color: #9a8a6a;
  font-size: .86rem;
  max-width: 440px;
  line-height: 1.8;
  margin-bottom: 1.8rem;
}
#btn-play {
  padding: .8rem 2.6rem;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Crimson Pro', serif;
  font-size: .86rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: all;
}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="hud-title">Ein Leben auf der Flucht</div>
      <div id="hud-chapter">Kapitel 1</div>
      <div id="timer-wrap">
        <div id="timer-icon">⏱</div>
        <div id="timer-bar-bg"><div id="timer-bar"></div></div>
        <div id="timer-text">30</div>
      </div>
    </div>
    
    <div id="gameover-overlay" class="overlay">
      <h2>⏱ Zeit abgelaufen</h2>
      <p id="gameover-text">Die Zeit ist um.</p>
      <button id="btn-retry" onclick="retryLevel()">Level neu starten</button>
    </div>
  </div>
</div>

<div id="title-screen">
  <h1>Ein Leben auf der Flucht</h1>
  <div class="title-sub">Die Geschichte von Eva-Lotte Rosendahl · 1925–1948</div>
  <p>Erkunde die Orte im Leben von Eva-Lotte – einer jüdischen Jugendlichen aus Essen. Sammle alle Dokumente bevor die Zeit abläuft.</p>
  <button id="btn-play" onclick="startGame()">Spiel beginnen</button>
</div>

<script>
// Canvas Initialisierung für Retina / iPad Displays absichern
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let gameInterval = null;
let timeLeft = 30;

function startGame() {
  try {
    // 1. Start-Screen ausblenden
    const titleScreen = document.getElementById('title-screen');
    if (titleScreen) {
      titleScreen.style.display = 'none';
    }

    // 2. Canvas absichern
    resizeCanvas();

    // 3. Timer-Loop starten (verhindert Einfrieren)
    if (gameInterval) clearInterval(gameInterval);
    timeLeft = 30;
    updateTimerUI();

    gameInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0) {
        clearInterval(gameInterval);
        triggerGameOver();
      }
    }, 1000);

    // Starte hier deinen Game-Loop / Render-Loop falls vorhanden
    requestAnimationFrame(gameLoop);

  } catch (err) {
    alert("Fehler beim Starten: " + err.message);
  }
}

function updateTimerUI() {
  const timerText = document.getElementById('timer-text');
  const timerBar = document.getElementById('timer-bar');
  if (timerText) timerText.textContent = timeLeft;
  if (timerBar) {
    const percentage = (timeLeft / 30) * 100;
    timerBar.style.width = percentage + '%';
  }
}

function triggerGameOver() {
  const overlay = document.getElementById('gameover-overlay');
  if (overlay) overlay.classList.add('open');
}

function retryLevel() {
  const overlay = document.getElementById('gameover-overlay');
  if (overlay) overlay.classList.remove('open');
  startGame();
}

function gameLoop() {
  // Einfacher Test-Render damit der Canvas nicht leer bleibt
  ctx.fillStyle = '#12100e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#c49a3c';
  ctx.font = '20px Crimson Pro';
  ctx.textAlign = 'center';
  ctx.fillText('Spiel läuft auf dem iPad...', canvas.width / 2, canvas.height / 2);
}
</script>
</body>
</html>
